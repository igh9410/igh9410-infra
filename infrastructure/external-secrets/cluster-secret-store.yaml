# GCP Secret Manager store shared by app namespaces.
# The SA key Secret is created by infrastructure/terraform/gcp.tf.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  # Only these namespaces may read from the store.
  conditions:
    - namespaces:
        - dev
        - prod
  provider:
    gcpsm:
      projectID: igh9410-infra
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-credentials
            key: secret-access-credentials
            namespace: external-secrets
