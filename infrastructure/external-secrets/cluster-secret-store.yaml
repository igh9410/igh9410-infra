# One GCP Secret Manager store per environment project. Each store is limited
# to its own namespace. Both use the ESO service-account key created by
# infrastructure/terraform/gcp.tf; per-secret read access is granted in each
# app's terraform/<env>/secrets.tf.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager-dev
spec:
  conditions:
    - namespaces:
        - dev
  provider:
    gcpsm:
      # landskipify-dev
      projectID: gramnuri-dev-7d221
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-credentials
            key: secret-access-credentials
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager-prod
spec:
  conditions:
    - namespaces:
        - prod
  provider:
    gcpsm:
      projectID: landskipify
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-credentials
            key: secret-access-credentials
            namespace: external-secrets
