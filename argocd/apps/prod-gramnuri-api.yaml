apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gramnuri-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/igh9410/igh9410-infra.git
    targetRevision: main
    path: apps/gramnuri-api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Manual sync only: production rollouts (and their PreSync DB migrations)
    # are started explicitly from the ArgoCD UI/CLI after the image tag lands in Git.
    # Do not add an `automated` block here, not even with `enabled: false`: the
    # Argo CD UI treats any non-null `automated` as auto-sync enabled, so every
    # applications-app-of-apps sync made these apps look (and toggle) as auto-sync.
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 5
