# Syncs the GCP Secret Manager secret <env>-gramnuri-api (a JSON object, one
# key per env var) into the Secret gramnuri-secrets.
# The store and key are set per environment in overlays/<env>/kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gramnuri-secrets
  annotations:
    # Before the workload, so the Secret exists on a fresh namespace.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager-ENV
  target:
    name: gramnuri-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ENV-gramnuri-api
