apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
components:
  - ../../components/db-migration
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: gramnuri-api
  - path: httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: gramnuri-api-httproute
  - target:
      kind: ExternalSecret
      name: gramnuri-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: dev-gramnuri-api
      - op: replace
        path: /spec/secretStoreRef/name
        value: gcp-secret-manager-dev
images:
  - name: ghcr.io/igh9410/gramnuri-api
    newTag: 937a13b3c343b712c1faedab7968d83310667043
