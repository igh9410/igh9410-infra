apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: gramnuri-api
  - path: httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: gramnuri-api-httproute
  - target:
      kind: ExternalSecret
      name: gramnuri-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: prod-gramnuri-api
      - op: replace
        path: /spec/secretStoreRef/name
        value: gcp-secret-manager-prod
images:
  - name: ghcr.io/igh9410/gramnuri-api
    newTag: 0fed33dcf9fdc81ee6a54c74783054106d360587
