apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - canary-service.yaml
components:
  - ../../components/db-migration
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: gramnuri-api
  # Must stay after deployment-patch.yaml: it turns the patched Deployment into a Rollout.
  - path: rollout-patch.yaml
    target:
      kind: Deployment
      name: gramnuri-api
    options:
      allowKindChange: true
  - path: httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: gramnuri-api-httproute
  - target:
      kind: ExternalSecret
      name: gramnuri-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: prod-gramnuri-api
      - op: replace
        path: /spec/secretStoreRef/name
        value: gcp-secret-manager-prod
images:
  - name: ghcr.io/igh9410/gramnuri-api
    newTag: build-130
