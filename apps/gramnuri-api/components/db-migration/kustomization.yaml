apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Runs goose migrations as an ArgoCD PreSync hook before each sync of gramnuri-api.
# The Job uses the gramnuri-api image, so the overlay's `images:` tag also pins
# the migration files that run. Requires the gramnuri-migrator-secrets Secret
# (apps/gramnuri-api/terraform/<env>/db-migrator.tf).
resources:
  - migration-job.yaml
