apiVersion: apps/v1
kind: Deployment
metadata:
  name: gramnuri-web
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: gramnuri-web
          image: ghcr.io/igh9410/gramnuri-web
          resources:
            requests:
              cpu: 200m
              memory: 500Mi
            limits:
              cpu: 200m
              memory: 500Mi
          envFrom:
            - secretRef:
                name: gramnuri-client-secrets
