apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: gramnuri-web
  - path: httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: gramnuri-web-httproute
  - target:
      kind: ExternalSecret
      name: gramnuri-client-secrets
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: dev-gramnuri-web
      - op: replace
        path: /spec/secretStoreRef/name
        value: gcp-secret-manager-dev
images:
  - name: ghcr.io/igh9410/gramnuri-web
    newTag: "75763b5752fbfbb74aacacd6d9c0caa25d32d2fd"
