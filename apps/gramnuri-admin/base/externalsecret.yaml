# Syncs the GCP Secret Manager secret <env>-gramnuri-web (a JSON object, one
# key per env var) into the Secret gramnuri-admin-secrets.
# The admin app is a React Router BFF like gramnuri-web and reads the same
# variables (BACKEND_API_URL and the Firebase web config), so it shares that
# secret instead of having its own. It must never read <env>-gramnuri-api,
# which holds database and provider credentials.
# The store and key are set per environment in overlays/<env>/kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gramnuri-admin-secrets
  annotations:
    # Before the workload, so the Secret exists on a fresh namespace.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager-ENV
  target:
    name: gramnuri-admin-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ENV-gramnuri-web
