---
# Prepares the standalone Linux lab VM used by docs/linux-lab.
# The VM is NOT part of the main k3s cluster: it runs its own single-node k3s
# so destructive labs (OOM, disk full, conntrack exhaustion) never touch prod.
#
# Usage (from the ansible/ directory):
#   ansible-playbook -i inventory/inventory.ini playbooks/setup_linux_lab.yml
- name: Prepare the Linux lab VM
  hosts: linux_lab
  become: true
  vars:
    # Keep the lab on the same k3s version as the main cluster
    # (infrastructure/system-upgrade-controller/plans.yaml).
    k3s_version: "v1.34.4+k3s1"
  tasks:
    - name: Install troubleshooting, load and tracing tools
      ansible.builtin.apt:
        name:
          - sysstat # vmstat, iostat, mpstat, pidstat, sar
          - procps
          - psmisc
          - lsof
          - strace
          - ltrace
          - tcpdump
          - conntrack
          - iproute2
          - dnsutils
          - iotop
          - fio
          - stress-ng
          - bpftrace
          - bpfcc-tools # BCC tools, installed with a -bpfcc suffix on Ubuntu
          - linux-tools-generic # perf
          - jq
          - python3
        state: present
        update_cache: true

    - name: Enable sysstat history so sar can look back in time
      ansible.builtin.lineinfile:
        path: /etc/default/sysstat
        regexp: "^ENABLED="
        line: 'ENABLED="true"'
      notify: Restart sysstat

    - name: Check that the unified cgroup v2 hierarchy is mounted
      ansible.builtin.command: stat -fc %T /sys/fs/cgroup
      register: cgroup_fs
      changed_when: false
      failed_when: cgroup_fs.stdout != "cgroup2fs"

    - name: Install single-node k3s (flannel + kube-proxy defaults, no Traefik)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
            --write-kubeconfig-mode 0644 \
            --disable traefik
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Wait for the lab node to become Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

  handlers:
    - name: Restart sysstat
      ansible.builtin.service:
        name: sysstat
        state: restarted
