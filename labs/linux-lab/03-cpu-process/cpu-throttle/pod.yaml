apiVersion: v1
kind: Pod
metadata:
  name: cpu-throttle
  labels:
    app.kubernetes.io/part-of: "linux-lab"
    lab: "03-cpu-throttle"
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: burner
      image: "busybox:1.37"
      command: ["sh", "-c"]
      # Two busy loops want 2 full CPUs, the limit allows half of one.
      # Question: what happens to the process, and where can you see it?
      args:
        - |
          trap 'exit 0' TERM
          for i in 1 2; do
            ( while :; do :; done ) &
          done
          wait
      resources:
        requests:
          cpu: "100m"
          memory: "16Mi"
        limits:
          cpu: "500m"
          memory: "32Mi"
