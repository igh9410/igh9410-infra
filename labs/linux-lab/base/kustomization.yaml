apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply once per lab cluster. The individual labs only set `namespace: linux-lab`
# and do not include this base, so `kubectl delete -k <lab>` never deletes the
# namespace together with one lab.
resources:
  - namespace.yaml
  - limit-range.yaml
  - resource-quota.yaml
